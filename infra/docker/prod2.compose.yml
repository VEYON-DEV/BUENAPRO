# Explicitly combine with docker-compose.yml; private inputs stay outside Git.
services:
  prod2-ingest:
    profiles: ["prod2-only"]
    image: ${PROD2_IMAGE:?Set the reviewed PROD2 image}
    restart: "no"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30m
    env_file:
      - ${PROD2_RUNTIME_ENV:?Set a private env file; it may be empty during operator hold}
    command:
      - python
      - -m
      - buenapro_worker.prod2.service
      - --config
      - /run/prod2/service.private.json
      - --state-dir
      - /var/lib/buenapro/prod2
    volumes:
      - type: bind
        source: ${PROD2_SERVICE_CONFIG:?Set the private service config file}
        target: /run/prod2/service.private.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROD2_STATE_DIR:?Set the private durable service directory}
        target: /var/lib/buenapro/prod2
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Manual grading («Calificar») of mayores, next to the daily service: same image and environment, its own
  # state directory, and the service's state and configuration read only. It runs a pass only while the
  # service is `waiting` and far from its next cycle (see buenapro_worker.prod2.manual_grading), so starting
  # or restarting it never alerts the operators of the daily service. A payment doubt opens
  # guard.private.json in PROD2_MANUAL_STATE_DIR; it stays open (the container idles) until an operator
  # removes it. Run: docker compose ... --profile prod2-manual up -d prod2-manual
  # PROD2_MANUAL_STATE_DIR has a placeholder default on purpose: Compose interpolates every service of the
  # file, so a required variable here would break starting prod2-ingest alone. Unset, this service refuses
  # to start (the bind source does not exist).
  prod2-manual:
    profiles: ["prod2-manual"]
    image: ${PROD2_IMAGE:?Set the reviewed PROD2 image}
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30m
    env_file:
      - ${PROD2_RUNTIME_ENV:?Set a private env file; it may be empty during operator hold}
    command:
      - python
      - /app/scripts/grade_prod2_manual.py
      - --loop
      - --state-dir
      - /var/lib/buenapro/prod2-manual
      - --service-state-dir
      - /var/lib/buenapro/prod2-service
      - --service-config
      - /run/prod2/service.private.json
      - --max-requests-per-pass
      - "5"
      - --poll-seconds
      - "60"
      - --safety-minutes
      - "60"
    volumes:
      - type: bind
        source: ${PROD2_MANUAL_STATE_DIR:-/nonexistent/set-PROD2_MANUAL_STATE_DIR}
        target: /var/lib/buenapro/prod2-manual
        bind:
          create_host_path: false
      - type: bind
        source: ${PROD2_STATE_DIR:?Set the daily service state directory}
        target: /var/lib/buenapro/prod2-service
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROD2_SERVICE_CONFIG:?Set the private service config file}
        target: /run/prod2/service.private.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
